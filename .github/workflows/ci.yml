name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint (syntax errors, undefined names, unused imports)
        run: ruff check --select E9,F63,F7,F82,F401 .

      - name: Cell, task-check and KPI tests
        run: python -m pytest -v
